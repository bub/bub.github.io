name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove corrupted lockfile
        run: |
          rm -f yarn.lock
          echo "Removed yarn.lock to regenerate from npmjs.org"

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject matching TypeScript dependencies
        run: |
          REACT_VER=$(node -e "const p=require('./package.json'); console.log((p.dependencies&&p.dependencies.react)||(p.devDependencies&&p.devDependencies.react)||'18')")
          REACT_MAJOR=$(echo "$REACT_VER" | tr -dc '0-9' | cut -c1)
          echo "Detected React major version: $REACT_MAJOR"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.devDependencies = pkg.devDependencies || {};
            pkg.devDependencies.typescript = '^5.0.0';
            pkg.devDependencies['@types/react'] = '^${REACT_MAJOR}.0.0';
            pkg.devDependencies['@types/react-dom'] = '^${REACT_MAJOR}.0.0';
            pkg.devDependencies['@types/node'] = '^20.0.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: yarn install

      - name: Build with Next.js
        run: yarn next build

      - name: Export static site with Next.js
        run: yarn next export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4